<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#f1f8fc"/>
  <circle cx="200" cy="155" r="112" fill="#dcecf8"/>
  <!-- grande roue dentée -->
  <g fill="#0074c7">
    <g transform="translate(176 150)">
      <rect x="-12" y="-78" width="24" height="26" rx="3"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(45)"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(90)"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(135)"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(180)"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(225)"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(270)"/>
      <rect x="-12" y="-78" width="24" height="26" rx="3" transform="rotate(315)"/>
      <circle r="60"/>
      <circle r="24" fill="#dcecf8"/>
    </g>
  </g>
  <!-- petite roue dentée -->
  <g fill="#82b864" transform="translate(268 210)">
    <rect x="-8" y="-46" width="16" height="16" rx="2"/>
    <rect x="-8" y="-46" width="16" height="16" rx="2" transform="rotate(60)"/>
    <rect x="-8" y="-46" width="16" height="16" rx="2" transform="rotate(120)"/>
    <rect x="-8" y="-46" width="16" height="16" rx="2" transform="rotate(180)"/>
    <rect x="-8" y="-46" width="16" height="16" rx="2" transform="rotate(240)"/>
    <rect x="-8" y="-46" width="16" height="16" rx="2" transform="rotate(300)"/>
    <circle r="34"/>
    <circle r="12" fill="#dcecf8"/>
  </g>
  <!-- marteau -->
  <g transform="rotate(40 286 110)">
    <rect x="280" y="80" width="12" height="86" rx="5" fill="#384050"/>
    <rect x="262" y="66" width="48" height="22" rx="4" fill="#00497c"/>
  </g>
</svg>
